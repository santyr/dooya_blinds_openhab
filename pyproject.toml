[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dooya-openhab"
version = "0.1.0"
description = "Local Dooya Connector WLAN to MQTT adapter for openHAB"
requires-python = ">=3.11"
dependencies = ["pycryptodomex>=3.20,<4", "paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dooya-openhab = "dooya_openhab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
